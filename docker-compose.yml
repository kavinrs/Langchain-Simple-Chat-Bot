version: '3.8'

services:
  backend:
    image: python:3.12
    working_dir: /app
    command: >
      sh -c "pip install 'fastapi[standard]' 'langchain>=1.2.15' 'langchain-openai>=1.2.1' 
             'langchain-google-community>=4.0.0' 'python-dotenv' 'redis>=7.4.0' 
             'sympy>=1.14.0' 'pyowm>=3.5.0' 'ddgs>=9.14.1' 'pandas>=3.0.2' &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
    depends_on:
      - redis
    networks:
      - chatbot-network

  frontend:
    image: node:18
    working_dir: /app/frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - chatbot-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  chatbot-network:
    driver: bridge
